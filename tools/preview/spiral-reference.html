<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Exhale spiral — reference render</title>
<style>
  body { margin:0; background:#081A1D; color:#E9F5F3;
         font-family: 'Space Grotesk', system-ui, sans-serif; padding:24px; }
  .grid { display:flex; flex-wrap:wrap; gap:20px; }
  .cell { width:302px; }
  .cap { font-size:12px; color:rgba(233,245,243,.55); margin-bottom:6px;
         font-variant-numeric:tabular-nums; }
  .stage { position:relative; width:302px; height:302px; }
  .center { position:absolute; inset:0; display:flex; flex-direction:column;
            align-items:center; justify-content:center; pointer-events:none;
            background: radial-gradient(circle, #081A1D 0%, #081A1D 58px, rgba(8,26,29,0) 82px); }
  .ov { font-size:11px; letter-spacing:.3em; color:rgba(233,245,243,.5); }
  .val { font-weight:700; line-height:1; color:#EFFCF9; }
  .sub { font-size:12px; color:rgba(233,245,243,.5); margin-top:5px; }
  .dotcap { text-align:center; font-size:11px; letter-spacing:.06em;
            color:rgba(233,245,243,.4); margin-top:2px; }
  .meta { font-size:11px; color:#7FD8CB; margin-top:4px; font-family:ui-monospace,monospace; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
const GOLDEN = 2.399963;

function spiral(dayN) {
  const n = Math.min(dayN, 3650);
  const cx = 151, cy = 151, holeR = 44, maxR = 145;
  const annulusArea = Math.PI * (maxR*maxR - holeR*holeR);
  const size = Math.max(3, Math.min(13,
      Math.round(2 * Math.sqrt(annulusArea / (Math.max(n,40) * Math.PI)) * 0.62 * 10) / 10));
  const dots = [];
  for (let i = 0; i < n; i++) {
    const t = n > 1 ? i/(n-1) : 1;
    const angle = i * GOLDEN - 1.6;
    const r = holeR + (maxR - holeR - size/2) * Math.sqrt(n > 1 ? i/(n-1) : 1);
    const isYear = (i+1) % 365 === 0;
    dots.push({
      left: (cx + r*Math.cos(angle) - size/2).toFixed(1),
      top:  (cy + r*Math.sin(angle) - size/2).toFixed(1),
      size: isYear ? Math.min(13, size*1.6) : size,
      bg: isYear ? "#E8A87F"
        : "hsl(" + Math.round(18 + t*154) + " " + Math.round(85 - t*25) + "% " + Math.round(54 + t*8) + "%)",
      glow: i === n-1 ? "0 0 16px 4px rgba(127,216,203,.5)"
          : (isYear ? "0 0 8px 1px rgba(232,168,127,.7)" : "none")
    });
  }
  return { dots, size, n };
}

function center(dayN) {
  const years = Math.floor(dayN/365);
  if (years >= 1) {
    const rem = dayN - years*365;
    return { ov: years === 1 ? "YEAR" : "YEARS", val: String(years),
             sub: rem > 0 ? "+ " + rem + " days" : "to the day", size: 52 };
  }
  return { ov:"DAY", val:String(dayN), sub:"", size: dayN > 99 ? 46 : 52 };
}

const DAYS = [1, 90, 365, 730, 1825, 3650];
const grid = document.getElementById('grid');
for (const d of DAYS) {
  const { dots, size, n } = spiral(d);
  const c = center(d);
  const cell = document.createElement('div');
  cell.className = 'cell';
  const yearMarks = dots.filter((_,i) => (i+1)%365===0).length;
  cell.innerHTML =
    '<div class="cap">day ' + d.toLocaleString('en-US') + '</div>' +
    '<div class="stage">' +
      dots.map(o => '<div style="position:absolute;left:'+o.left+'px;top:'+o.top+
        'px;width:'+o.size+'px;height:'+o.size+'px;border-radius:50%;background:'+
        o.bg+';box-shadow:'+o.glow+'"></div>').join('') +
      '<div class="center"><div class="ov">'+c.ov+'</div>' +
      '<div class="val" style="font-size:'+c.size+'px">'+c.val+'</div>' +
      (c.sub ? '<div class="sub">'+c.sub+'</div>' : '') + '</div>' +
    '</div>' +
    (d > 120 ? '<div class="dotcap">'+d.toLocaleString('en-US')+' days — one dot each</div>' : '') +
    '<div class="meta">n='+n+'  dot='+size+'px  yearMarks='+yearMarks+'</div>';
  grid.appendChild(cell);
}
</script>
</body>
</html>
