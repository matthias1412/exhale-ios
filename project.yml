name: Exhale
options:
  bundleIdPrefix: com.matthias1412
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # SWIFT_VERSION is the *language mode*: 4, 4.2, 5 or 6. "5.9" is not valid.
    SWIFT_VERSION: "5"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # 'targeted' rather than 'complete': I can't compile locally, so the first
    # CI build should fail on real mistakes, not on concurrency pedantry.
    SWIFT_STRICT_CONCURRENCY: targeted
    # Required for [[stitchable]] SwiftUI shaders.
    MTL_ENABLE_DEBUG_INFO: NO

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"

targets:
  Exhale:
    type: application
    platform: iOS
    sources:
      - path: Exhale
      - path: Shared
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthias1412.exhale
        PRODUCT_NAME: Exhale
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Exhale/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Exhale/Resources/Exhale.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        debug:
          # Simulator builds (build + screenshot jobs) sign ad-hoc.
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
          # Required for `@testable import Exhale`; XcodeGen doesn't inherit
          # Xcode's template default.
          ENABLE_TESTABILITY: YES
        release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.matthias1412.exhale

  ExhaleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ExhaleTests
    dependencies:
      - target: Exhale
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO

schemes:
  Exhale:
    build:
      targets:
        Exhale: all
        ExhaleTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ExhaleTests
    run:
      config: Debug
    archive:
      config: Release
