name: Build

# Dispatch only — nothing runs on push. See docs/ci-costs.md.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Run unit tests"
        type: boolean
        default: true
      testflight:
        description: "Sign and upload to TestFlight (needs match + App Store Connect secrets)"
        type: boolean
        default: false
      setup_signing:
        description: "First run only — let match CREATE certificates. Leave off afterwards."
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    # Job level, not step level: project.yml substitutes DEVELOPMENT_TEAM at
    # xcodegen time, which happens several steps before signing. Setting it
    # only on the TestFlight step generated a project with an empty team and
    # failed the archive with "requires a development team".
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

    steps:
      - uses: actions/checkout@v4

      # Discovers Xcode and simulator names rather than hardcoding them —
      # runner images rename devices between releases.
      - name: Select toolchain
        run: bash .github/scripts/select-toolchain.sh

      # Seconds, and they catch things a compiler cannot: a seed name with no
      # case behind it, a bash-3.2 incompatibility, an app icon that has
      # drifted away from the mark drawn inside the app.
      - name: Lint
        run: |
          python3 tools/lint-seeds.py
          python3 tools/lint-logo.py
          bash tools/lint-shell.sh

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # Generic destination: compiles for the simulator without needing any
      # particular device to exist.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Exhale \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        if: ${{ inputs.tests }}
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Exhale \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIM_ONE" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: TestFlight
        if: ${{ inputs.testflight }}
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          SETUP_SIGNING: ${{ inputs.setup_signing }}
        run: bundle exec fastlane beta
